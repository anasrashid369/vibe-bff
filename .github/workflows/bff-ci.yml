name: bff-ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Run tests
        run: npx vitest run

      - name: Bundle (proves the deployable artifact actually builds)
        run: npm run bundle
